version: '3.8'

# Only nginx (port 80) is reachable from the network. Everything else is
# either internal to the compose network or bound to 127.0.0.1 for local
# debugging. Passwords come from .env (see .env.example) — compose refuses to
# start if they are missing instead of falling back to known defaults.

services:

  # ── MySQL Database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: flowork_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: king
      MYSQL_USER: flowork
      MYSQL_PASSWORD: ${FLOWORK_DB_PASSWORD:?set FLOWORK_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    ports:
      - "127.0.0.1:3307:3306"   # this machine only (MySQL Workbench etc.)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PHP + Apache ──────────────────────────────────────────────────────────
  app:
    build: ./docker/app
    container_name: flowork_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: king
      DB_USER: flowork
      DB_PASS: ${FLOWORK_DB_PASSWORD:?set FLOWORK_DB_PASSWORD in .env}
      APP_ENV: ${DOCKER_APP_ENV:-production}
    volumes:
      - .:/var/www/html
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "127.0.0.1:8080:80"     # direct access for debugging, this machine only

  # ── Redis (not used by the app yet; internal only) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flowork_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx Reverse Proxy (the only public entry point) ─────────────────────
  web:
    image: nginx:alpine
    container_name: flowork_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"     # Main entry point http://localhost
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro

  # ── phpMyAdmin (asks for a login; this machine only) ──────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: flowork_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"   # http://localhost:8081

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
