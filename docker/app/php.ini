; Flowork PHP settings
display_errors = Off   ; APP_ENV=local turns page errors on (includes/env_loader.php)
error_reporting = E_ALL
log_errors = On
error_log = /var/log/apache2/php_errors.log

; File uploads
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120
memory_limit = 256M

; Session
session.gc_maxlifetime = 7200
session.cookie_httponly = 1

; Timezone
date.timezone = Africa/Harare

; MySQL exceptions OFF — flowork handles errors manually
mysqli.allow_persistent = On
