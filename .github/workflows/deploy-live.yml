# Deploy to the live cPanel site on every push to master.
#
# GitHub uploads the changed files to the site over FTPS, so a `git push`
# updates GitHub and the live site in one step. Only files that changed since
# the last deploy are sent (the list is kept in .ftp-deploy-sync-state.json on
# the server, which .htaccess hides like every dotfile).
#
# One-time setup (DEPLOYMENT.md, "Automatic deploy to cPanel"):
#   cPanel → FTP Accounts: an account whose directory is the site's folder.
#   GitHub → Settings → Secrets and variables → Actions → New repository secret:
#     FTP_SERVER     e.g. ftp.coreafricagrp.com
#     FTP_USERNAME   e.g. deploy@coreafricagrp.com
#     FTP_PASSWORD   that account's password
#     FTP_SERVER_DIR the site folder as the FTP account sees it, ending in /
#                    (./ when the account opens straight in the site folder)
#
# Never uploaded, so the live copies stay as they are: .env and the TIMB key,
# uploads/ (logos, documents), backups, and developer-only folders.
# Nothing on the server is deleted except files this workflow uploaded earlier
# and that were since removed from git.

name: Deploy to live site

on:
  push:
    branches: [master]
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab

concurrency:
  group: deploy-live
  cancel-in-progress: false  # let a running upload finish; the next one follows

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          bad=0
          for f in $(git ls-files '*.php'); do
            php -l "$f" > /dev/null 2> err.txt || { echo "::error file=$f::$(cat err.txt)"; bad=1; }
          done
          exit $bad

      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          security: loose          # shared hosts often use a certificate for the host name, not ftp.<domain>
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .idea/**
            .claude/**
            .env
            .env.*
            includes/timb_key.php
            uploads/**
            backups/**
            scratch/**
            tests/**
            docker/**
            docker-compose.yml
            maintenance/**
            **/*.md
            **/*.zip
            **/*.sql
